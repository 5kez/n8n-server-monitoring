services:
  n8n:
    image: n8nio/n8n:1.123.6
    container_name: n8n_automate
    restart: unless-stopped
    user: "0:0"
    environment:
      - TZ=Asia/Bangkok
      - GENERIC_TIMEZONE=Asia/Bangkok

      # Must match the address people use to open n8n
      - N8N_PROTOCOL=http
      - N8N_PORT=5678
      - N8N_HOST=n8n.local
      - WEBHOOK_URL=http://n8n.local:5678
      - N8N_SECURE_COOKIE=false

      # Required because Nginx sits in front of n8n
      - N8N_BEHIND_PROXY=true
      - N8N_TRUST_PROXY=true

      # The workflows run mkdir and write log files on the n8n host
      - N8N_EXECUTE_COMMAND_ENABLED=true
      - N8N_RUNNERS_ENABLED=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false

      - N8N_USER_FOLDER=/home/node/.n8n
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}  # set in .env, never commit the real key
      - N8N_CUSTOM_EXTENSIONS=/home/node/n8n-custom-nodes
    volumes:
      - n8n_data:/home/node/.n8n
      - ../custom-nodes:/home/node/n8n-custom-nodes
      - ./monitor-data:/data/monitor   # raw + JSON logs, read by the webhook API
    networks:
      - n8n_net

  nginx:
    image: nginx:stable
    container_name: n8n_nginx
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - n8n
    networks:
      - n8n_net

volumes:
  n8n_data:

networks:
  n8n_net:
